<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="480" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1099" height="479" fill="none" stroke="#E5E4DF" stroke-width="1"/>

  <rect x="30" y="224" width="1040" height="68" rx="8" fill="#F1F8F4"/>

  <text x="60" y="50" font-size="27" font-weight="700" fill="#2C2C2A">Cost and accuracy on 45 hard LiveCodeBench problems</text>
  <text x="60" y="78" font-size="16" fill="#5F5E5A">Same problems, same oracle. The hybrid matches Fusion's accuracy for ~37× less; the council trades some accuracy to run free, on-device.</text>

  <text x="375" y="126" font-size="13" font-weight="700" fill="#888780" text-anchor="middle">ACCURACY</text>
  <text x="730" y="126" font-size="13" font-weight="700" fill="#888780" text-anchor="middle">COST TO SOLVE ALL 45  (measured spend)</text>

  <line x1="420" y1="138" x2="420" y2="402" stroke="#D3D1C7" stroke-width="1"/>
  <line x1="440" y1="138" x2="440" y2="402" stroke="#C7C5BC" stroke-width="1"/>
  <line x1="590" y1="138" x2="590" y2="402" stroke="#F1EFE8" stroke-width="1"/>
  <line x1="740" y1="138" x2="740" y2="402" stroke="#F1EFE8" stroke-width="1"/>
  <line x1="890" y1="138" x2="890" y2="402" stroke="#F1EFE8" stroke-width="1"/>
  <line x1="1040" y1="138" x2="1040" y2="402" stroke="#F1EFE8" stroke-width="1"/>
  <text x="440" y="420" font-size="13" fill="#888780" text-anchor="middle">$0</text>
  <text x="590" y="420" font-size="13" fill="#888780" text-anchor="middle">$5</text>
  <text x="740" y="420" font-size="13" fill="#888780" text-anchor="middle">$10</text>
  <text x="890" y="420" font-size="13" fill="#888780" text-anchor="middle">$15</text>
  <text x="1040" y="420" font-size="13" fill="#888780" text-anchor="middle">$20</text>

  <text x="300" y="170" font-size="16" font-weight="700" fill="#444441" text-anchor="end">OpenRouter Fusion</text>
  <text x="300" y="189" font-size="13" fill="#888780" text-anchor="end">cloud · 8 models, every problem</text>
  <text x="375" y="184" font-size="22" font-weight="700" fill="#444441" text-anchor="middle">91.1%</text>
  <rect x="440" y="152" width="549" height="50" rx="4" fill="#6b6a66"/>
  <text x="977" y="183" font-size="18" font-weight="700" fill="#ffffff" text-anchor="end">$18.31</text>

  <text x="300" y="252" font-size="16" font-weight="700" fill="#0F6E56" text-anchor="end">LLM-Jury hybrid</text>
  <text x="300" y="271" font-size="13" fill="#5F5E5A" text-anchor="end">local council + 1 escalation</text>
  <text x="375" y="266" font-size="22" font-weight="700" fill="#0F6E56" text-anchor="middle">97.8%</text>
  <rect x="440" y="234" width="15" height="50" rx="3" fill="#1D9E75"/>
  <text x="467" y="259" font-size="18" font-weight="700" fill="#0F6E56">$0.49</text>
  <text x="467" y="280" font-size="14" fill="#854F0B">matches Fusion's accuracy  ·  ~37× cheaper</text>

  <text x="300" y="334" font-size="16" font-weight="700" fill="#3B6D11" text-anchor="end">LLM-Jury council</text>
  <text x="300" y="353" font-size="13" fill="#5F5E5A" text-anchor="end">fully local, no cloud</text>
  <text x="375" y="348" font-size="22" font-weight="700" fill="#3B6D11" text-anchor="middle">75.6%</text>
  <rect x="440" y="316" width="5" height="50" rx="2" fill="#639922"/>
  <text x="457" y="341" font-size="18" font-weight="700" fill="#3B6D11">$0.031</text>
  <text x="457" y="362" font-size="14" fill="#854F0B">~590× cheaper  ·  $0 on your laptop</text>

  <text x="60" y="458" font-size="13" fill="#888780">Don't vote, verify.  ·  pip install llm-jury-verify  ·  github.com/ajsai47/llm-jury</text>
  <text x="1040" y="458" font-size="12" fill="#B4B2A9" text-anchor="end">same oracle (public tests); hybrid–Fusion accuracy edge not significant (p=0.25)</text>
</svg>
