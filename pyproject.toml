[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-jury-verify"
version = "0.1.0"
description = "Local verified answers — don't vote, verify. A small-model council + a real verifier, on your own machine."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The AI Collective" }]
keywords = ["llm", "verification", "best-of-n", "local", "ollama", "code-generation", "fusion"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/ajsai47/llm-jury"
Post = "https://app.notion.com/p/3844834c4d7881d1adaeed9c3a81dcbb"

[project.scripts]
llmjury = "llmjury.cli:main"
jury = "llmjury.cli:main"

[tool.setuptools.packages.find]
include = ["llmjury*"]

[tool.setuptools.package-data]
"llmjury.benchmarks" = ["data/*.json"]
