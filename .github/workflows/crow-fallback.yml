# When Crow fails for its own reasons (clone dropped, run killed or timed out, Crow
# unreachable) rather than because a check step failed, run the GitHub CI
# for the PR head so the PR still gets a real result. A failed check step does not
# trigger GitHub; fix the code instead.
name: Crow fallback

on: status

permissions: {}

jobs:
  fallback:
    if: >-
      startsWith(github.event.context, 'ci/crow/pr/') &&
      (github.event.state == 'failure' || github.event.state == 'error')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Classify the Crow failure
        id: classify
        env:
          TARGET_URL: ${{ github.event.target_url }}
          CROW_TOKEN: ${{ secrets.CROW_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request

          CROW = "https://screddys-macbook-pro.tailb5dd6c.ts.net"

          def verdict(target_url, token):
              m = re.fullmatch(re.escape(CROW) + r"/repos/(\d+)/pipeline/(\d+)(?:/\d+)?/?", target_url or "")
              if not m:
                  return "check", "status link is not this Crow server; not trusting it"
              if not token:
                  return "infra", "no CROW_TOKEN secret, so the failure cannot be classified"
              req = urllib.request.Request(f"{CROW}/api/v1/repos/{m[1]}/pipelines/{m[2]}",
                                           headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      p = json.load(r)
              except Exception as e:
                  return "infra", f"Crow API unreachable ({type(e).__name__})"
              steps = [s for w in p.get("workflows") or [] for s in w.get("children") or []]
              failed_checks = [s["name"] for s in steps if s.get("type") == "commands" and s.get("state") == "failure"]
              if failed_checks:
                  return "check", "check step failed: " + ", ".join(failed_checks)
              bad = [f'{s["name"]}={s.get("state")}' for s in steps if s.get("state") not in ("success", "skipped")]
              return "infra", f'pipeline {p.get("status")}; no check step failed ({", ".join(bad) or "no step detail"})'

          if __name__ == "__main__":
              v, why = verdict(os.environ.get("TARGET_URL", ""), os.environ.get("CROW_TOKEN", ""))
              print(f"{v}: {why}")
              if os.environ.get("GITHUB_OUTPUT"):
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write(f"verdict={v}\n")
          PY
      - name: Run GitHub CI on the PR head
        if: steps.classify.outputs.verdict == 'infra'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.sha }}
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '[.[] | select(.head.sha == env.SHA)][0].head.ref // empty')
          if [ -z "$ref" ]; then echo "No open PR has $SHA as its head; nothing to rerun."; exit 0; fi
          gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref "$ref"
          echo "Started GitHub CI for $ref ($SHA)."
