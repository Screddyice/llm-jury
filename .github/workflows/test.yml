name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Crow CI on Shawn's Mac runs the same checks (.woodpecker.yaml) and posts a
  # ci/crow/... status within seconds of a push. This job waits up to 3 minutes for
  # one: found, the jobs below are skipped and Crow's result is the merge check;
  # none (Mac asleep or offline, webhook lost), they run here as before. A manual
  # run (workflow_dispatch) always runs them.
  crow-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Manual run: running GitHub CI."; echo run=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          for _ in $(seq 1 12); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" \
              --jq '[.[] | select(.context | startswith("ci/crow/"))] | length' || echo 0)
            if [ "${n:-0}" -gt 0 ]; then
              echo "Crow picked up $SHA; skipping GitHub CI (Crow's status is the check)."
              echo run=false >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 15
          done
          echo "No Crow status on $SHA after 3 minutes (Mac asleep or offline); running GitHub CI."
          echo run=true >> "$GITHUB_OUTPUT"

  test:
    needs: crow-gate
    if: needs.crow-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline test suite
        run: |
          python -m pip install 'pytest>=8'
          python -m pytest -q

  build:
    needs: crow-gate
    if: needs.crow-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the package
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install the wheel and check the console command
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/llmjury --version
